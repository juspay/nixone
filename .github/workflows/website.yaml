name: Deploy setup.sh to GitHub Pages

on:
  push:
    branches:
      - main
      - integration-test

jobs:
  test:
    # Note: Nix is already installed on this runner.
    runs-on: x86_64-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test setup.sh in Ubuntu VM
        run: |
          nix run .#ubuntu-test

